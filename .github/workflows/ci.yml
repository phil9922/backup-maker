# SPDX-License-Identifier: MIT
#
# Tests on every push and pull request, plus a cross-compile check so a break
# on Windows or macOS shows up here rather than at release time.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

      # THE GAP THIS CLOSES. The dashboard is a large part of this program and
      # `go test` cannot see a line of it: the JavaScript is an embedded asset,
      # so a syntax error compiles, ships, and produces a completely dead page —
      # every control inert, with nothing in any log. That happened on
      # 2026-07-28 (an unbalanced brace left by an edit), and only a browser
      # test caught it. `node --check` catches it in under a second.
      #
      # Deliberately only a PARSE check, not a linter: it asserts the one thing
      # whose failure is catastrophic and silent, and adds no style opinions
      # that would need maintaining.
      - name: Check dashboard JavaScript parses
        run: |
          for f in internal/webui/static/*.js; do
            node --check "$f" || { echo "::error file=$f::$f is not valid JavaScript — the dashboard would be dead on arrival"; exit 1; }
            echo "ok  $f"
          done

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./...
      # `go build ./...` does not compile TEST files, so a per-OS test file that
      # names something the platform's syscall package does not export builds
      # here and fails on the real runner — which costs a whole round trip to
      # learn, and did. Vet typechecks tests, and cross-compiles, so the answer
      # is available in seconds on this machine.
      - name: Typecheck tests for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...

  # WHAT THIS EXISTS FOR: macOS and Windows are release targets whose code had
  # only ever been COMPILED. `internal/browse` has real per-OS files
  # (mounts_darwin.go, drives_windows.go, blockdev_windows.go) that nothing had
  # ever executed, and the whole suite had only ever run on Linux — so nothing
  # had exercised a case-insensitive filesystem, a Windows path separator, or a
  # config directory that is not under $XDG_CONFIG_HOME. Cross-compiling proves
  # it builds, which is the smaller half.
  #
  # NON-BLOCKING, AND STAYING THAT WAY — asked and answered 2026-07-30, so do not
  # "finish the job" by deleting continue-on-error below.
  #
  # It was added non-blocking because a Linux-grown suite meeting two new
  # platforms was expected to fail, and it did: 57 failures, all of them the tests
  # being Linux-shaped rather than the program being wrong. Once those were fixed
  # the question was whether to let these jobs gate merges. They do not, on
  # purpose: these are hosted runners for platforms nobody here can reproduce a
  # failure on, and one of the tests they run was downloading a binary from GitHub
  # until b441c63. A flake on a machine we cannot inspect must not be able to stop
  # work on the machine this program actually protects.
  #
  # What that costs, stated plainly: a genuine per-OS regression will be REPORTED
  # and not enforced, so somebody has to look. The per-job conclusion is where it
  # shows — the run's overall conclusion is "success" even when this fails, which
  # is exactly what continue-on-error means and it hid a real failure from me
  # once. `gh run view <id> --json jobs` is the check.
  #
  # It cannot see UX: whether a Windows toast carries the right icon, or whether
  # the firewall dialog is the one a user needs, still needs a person at a
  # machine.
  per-os:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      # Both platforms report independently: one failing must not hide what the
      # other would have said.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      # No -race here, unlike the Linux job: the point of this job is executing
      # the per-OS paths at all, and a race detector on a fresh platform mixes
      # "this code is wrong" with "this platform is new" in one exit code. Its
      # own timeout, because a test harness that waits on a daemon lock hangs
      # rather than failing, and a hung job is 6 hours of a runner.
      - name: Test
        run: go test -timeout 12m ./...
